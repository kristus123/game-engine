<overlay id="videoOverlay"></overlay>

<overlay id="buttons">
	<h1 id="waiting">Waiting for livestream</h1>
	<button id="start" float-bot-left hidden on-click="startStream">Start livestream</button>
	<button id="stop" float-bot-left hidden on-click="stopStream">Stop livestream</button>
	<button float-top-right on-click="swapAudio">swap audio</button>
	<button float-top-left on-click="swapVideo">swap video</button>

	<button float-bot-right on-click-show-id="chat" id="open">open chat</button>
</overlay>

<chat-body id="chat" hidden></chat-body>
