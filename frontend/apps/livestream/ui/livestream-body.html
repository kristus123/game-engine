<overlay id="videoOverlay" center-children></overlay>

<overlay center-children>
	<h1 id="waiting">Waiting for livestream</h1>
</overlay>

<overlay>
	<button id="start" float-bot-left hidden on-click="startStream">Start livestream</button>
	<button id="stop" float-bot-left hidden>Stop livestream</button>

	<button float-bot-right id="openChat" on-click-show-id="chat">open chat</button>
</overlay>

<chat-body id="chat" hidden></chat-body>
