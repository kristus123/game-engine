<overlay id="videoOverlay">
	<h1 id="waiting">Waiting for livestream</h1>
</overlay>

<overlay>
	<button id="start" on-click-hide on-click-show-id="stop" float-bot-left hidden>Start livestream</button>
	<button id="stop" on-click-hide on-click-show-id="start" float-bot-left hidden>Stop livestream</button>

	<button float-bot-right id="openChat" on-click-show-id="chat">open chat</button>
</overlay>

<overlay id="chat" class="bgWhite" hidden>
	<phone-grid style="padding: 0px">
		<top center-h>
			<button id="closeChat">Close</button>
		</top>
		<mid>
			<flex-v close id="chatHistory" class="bgWhite" scrollable>
				<!-- chat-lines will be appended here -->
			</flex-v>
		</mid>
		<bot>
			<flex-h max-size style="padding: 5px; gap: 10px">
				<input max-size style="flex: 3; font-size: 30px" id="message" placeholder="Type" on-enter-call="sendMessage" />
				<button max-size style="flex: 1" id="send" on-click-call="sendMessage">Send</button>
			</flex-h>
		</bot>
	</phone-grid>
</overlay>
