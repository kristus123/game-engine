<overlay id="videoOverlay"></overlay>

<overlay>
	<button id="start" hide-on-click on-click-show="stop" float-bot-left hidden>Start livestream</button>
	<button id="stop" hide-on-click on-click-show="start" float-bot-left hidden>Stop livestream</button>

	<button float-bot-right id="openChat" on-click-show="chat">open chat</button>
</overlay>

<overlay id="chat" class="bgWhite" hidden>
	<phone-grid style="padding: 0px">
		<top center-h>
			<button id="closeChat" on-click-hide="chat">Close</button>
		</top>
		<mid>
			<flex-v close id="chatHistory" class="bgWhite" scrollable></flex-v>
		</mid>
		<bot>
			<flex-h max-size style="padding: 5px; gap: 10px">
				<input max-size style="flex: 3; font-size: 30px" id="message" placeholder="Type" />
				<button max-size style="flex: 1" id="send">Send</button>
			</flex-h>
		</bot>
	</phone-grid>
</overlay>
