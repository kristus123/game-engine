<overlay-fixed id="videoOverlay"></overlay-fixed>

<overlay-fixed id="buttons" center-content>
	<h1 center id="waiting">Waiting for livestream</h1>
</overlay-fixed>

<overlay-fixed allow-click-through>
	<button float-top-right on-click="openMicSettings">Microphones</button>
	<button float-top-left on-click="selectNextCam">video set</button>
	<button id="previewToggle" float-top-mid on-click="togglePreview">Preview media stream</button>

	<button float-bot-right on-click-show-id="chat">open chat</button>
	<button float-bot-mid id="viewCount">0</button>

	<button id="start" float-bot-left hidden on-click="startStream">Start livestream</button>
	<button id="stop" float-bot-left hidden on-click="stopStream">Stop livestream</button>
</overlay-fixed>

<chat-body id="chat" hidden></chat-body>

<overlay-fixed id="micSettings" hidden class="microphone-settings">
	<flex-v close class="microphone-settings__dialog">
		<h2 class="microphone-settings__title">Microphones</h2>
		<p class="microphone-settings__description">
			Select one microphone to use for the livestream. Your choice applies immediately.
		</p>
		<flex-v id="micList" close class="microphone-settings__list"></flex-v>
		<p id="micStatus" class="microphone-settings__status" role="status" aria-live="polite"></p>
		<flex-h tight class="microphone-settings__actions">
			<button id="clearMic" on-click="clearMic">Mute microphone</button>
			<button on-click="refreshMicrophones">Refresh list</button>
			<button on-click-hide-id="micSettings">Done</button>
		</flex-h>
	</flex-v>
</overlay-fixed>
