<overlay-fixed id="videoOverlay"></overlay-fixed>

<overlay-fixed id="buttons" center-content>
	<h1 center id="waiting">Waiting for livestream</h1>
</overlay-fixed>

<overlay-fixed allow-click-through>
	<button float-top-right on-click="openMicSettings">Microphones</button>
	<button float-top-left on-click="selectNextCam">video set</button>
	<button float-top-mid on-click-open-page="stream-preview-page">Preview media stream</button>

	<button float-bot-right on-click-show="chat">open chat</button>
	<button float-bot-mid id="viewCount">0</button>

	<button id="start" float-bot-left hidden on-click="startStream">Start livestream</button>
	<button id="stop" float-bot-left hidden on-click="stopStream">Stop livestream</button>
</overlay-fixed>

<chat-body id="chat" hidden></chat-body>
