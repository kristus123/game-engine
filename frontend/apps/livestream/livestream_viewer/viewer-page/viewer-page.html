<overlay-fixed id="videoOverlay"></overlay-fixed>

<overlay-fixed allow-click-through>
	<h1 id="statusMessage"></h1>
	<button float-bot-left on-click-open-as-modal-fixed="chat-page">open chat</button>
	<button id="enableSound" type="button" class="sound-prompt" on-click="enableSound" hidden>
		<span class="sound-prompt-card">
			<div class="sound-prompt-icon">🔊</div>
			<div>Click to enable sound</div>
		</span>
	</button>
	<button float-bot-right on-click="toggleFullscreen">toggleFullscreen</button>
</overlay-fixed>
