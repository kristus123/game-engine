<overlay-fixed max-size>
	<overlay-relative max-size>
		<infinite-img id="sun" cover src="Png.sun" scale="5" max-size></infinite-img>
	</overlay-relative>
</overlay-fixed>

	<horizontal-scroll id="area" style="padding: 200px">
		<overlay-relative style="display: grid; width: max-content; height: auto; max-width: none">
			<flex-h id="list" style="grid-area: 1 / 1; position: relative; width: max-content; flex-wrap: nowrap; gap: 80px"></flex-h>
		</overlay-relative>
	</horizontal-scroll>

	<overlay-relative float-bot max-width>
		<infinite-img id="grass" src="Png.infiniteGrass" scale="5" max-width></infinite-img>
	</overlay-relative>


</overlay-fixed>
