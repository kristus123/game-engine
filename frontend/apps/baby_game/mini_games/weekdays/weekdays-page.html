<section id="weekday-content">
	<h1>Days of the week</h1>
	<p>Tap a day to hear its name. Drag the cards into order, starting with Monday.</p>
	<button on-click="listen">Listen to the week</button>
	<div id="scrollarea">
		<flex-h id="days" close></flex-h>
	</div>
	<p id="feedback">Monday comes first. Which day comes next?</p>
	<button id="replay" on-click="restart" hidden>Play again</button>
	<p id="soundstatus"></p>
</section>
