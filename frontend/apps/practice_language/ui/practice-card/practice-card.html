<practice-language-grid cq-parent>
	<slot name="mid">
		<flex-v max-size space-evenly id="buttons" style="gap: 15px" show-if-state="hasCard">
			<button on-click="playFront" style="font-size: 20cqw; height: 20cqh">Front</button>
			<button on-click="playBack" style="font-size: 20cqw; height: 20cqh">Back</button>

			<hr style="margin: 10px" />

			<button on-click="easy" style="font-size: 20cqw; height: 20cqh">Easy</button>
			<button on-click="hard" style="font-size: 20cqw; height: 20cqh">Hard</button>
		</flex-v>

		<flex-v show-if-state="noMoreCards">
			<h1>Finished!</h1>
			<button on-click="practiceMore">Practice more?</button>
		</flex-v>

		<flex-v show-if-state="loading">
			<h1>loading</h1>
		</flex-v>
	</slot>

	<slot name="bot">
		<flex-h>
			<h1 center id="time"></h1>
			<button on-click-show-id="areYouSure">Delete</button>
		</flex-h>
	</slot>
</practice-language-grid>

<dialog id="areYouSure">
	<flex-v center-content>
		<h1>Are you sure you want to delete?</h1>
		<button on-click="deleteCard" on-click-hide-id="areYouSure">DELETE</button>
	</flex-v>
</dialog>
