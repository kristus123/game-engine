<phone-grid>
	<top center-content>
		<flex-h>
			<button on-click-page-go="practiceArea">Practice</button>
			<button on-click-page-go="settings">settings</button>
		</flex-h>
	</top>

	<mid center-content scrollable>
		<button show-if-state="idle" name="frontCardButtons" on-click="recordFront" on-click-set-state="recording">
			Start recording
		</button>

		<button show-if-state="idle" name="frontCardButtons" on-click="playFront" disabled>playFront</button>

		<hr />

		<button show-if-state="idle" name="backCardButtons" on-click="recordBack" on-click-set-state="recording">
			start recording
		</button>
		<button show-if-state="idle" name="backCardButtons" on-click="playBack" disabled>playBack</button>

		<button show-if-state="recording" on-click="stopRecording" on-click-set-state="idle">stop recording</button>
	</mid>

	<bot center-content>
		<button id="save" style="width: 200px" disabled>Save</button>
	</bot>
</phone-grid>
