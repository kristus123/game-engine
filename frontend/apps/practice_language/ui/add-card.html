<practice-language-grid>
	<slot name="mid">
		<flex-v fill-evenly max-size show-if-state="idle">
			<flex-h style="gap: 40px">
				<button on-click="recordFront" on-click-set-state="recording">Record Front</button>
				<button id="playFront" on-click="playFront" disabled>Play</button>
			</flex-h>

			<flex-h style="gap: 40px">
				<button on-click="recordBack" on-click-set-state="recording">Record Back</button>
				<button id="playBack" on-click="playBack" disabled>Play</button>
			</flex-h>
		</flex-v>

		<flex-v max-size hidden show-if-state="recording">
			<button on-click="stopRecording" on-click-set-state="idle">stop recording</button>
		</flex-v>
	</slot>

	<slot name="bot">
		<flex-h>
			<button id="save" on-click="save" style="width: 200px">Save</button>
		</flex-h>
	</slot>
</practice-language-grid>
