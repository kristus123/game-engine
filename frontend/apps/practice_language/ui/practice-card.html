<practice-language-grid>
	<slot name="mid">
		<flex-v max-size id="buttons" style="gap: 80px">
			<button on-click="playFront" style="font-size: 50px">play front</button>
			<button on-click="playBack" style="font-size: 50px">play back</button>
		</flex-v>
	</slot>

	<slot name="bot">
		<flex-h fill-evenly>
			<button on-click="easy">easy</button>
			<button on-click="hard">hard</button>
		</flex-h>
	</slot>
</practice-language-grid>
