<overlay-absolute max-size>
	<img max-size blur float src="Gif.aurora" />
	<overlay-absolute max-size>
		<button class="page-nav" float-top-left on-click-open-page="village-page">← Village</button>
		<section class="viking-content-page relationships-page-content">
			<h1>Relationships</h1>
			<p class="page-intro">Every neighbor remembers how we treat them.</p>
			<div class="relationship-list">
				<button class="relationship-card" on-click="showFrostholm">
					<div>
						<h2>Frostholm</h2>
						<p>Nearby farmers with full granaries.</p>
					</div>
					<span class="friendly">Friendly</span>
				</button>
				<button class="relationship-card" on-click="showRiverClan">
					<div>
						<h2>The River Clan</h2>
						<p>Skilled fishers who value fair trade.</p>
					</div>
					<span class="neutral">Uncertain</span>
				</button>
				<button class="relationship-card" on-click="showBlackPine">
					<div>
						<h2>Black Pine Watch</h2>
						<p>Hunters who keep their distance from Vikingheim.</p>
					</div>
					<span class="cautious">Cautious</span>
				</button>
			</div>
		</section>
	</overlay-absolute>
</overlay-absolute>
<custom-modal id="modal" hidden></custom-modal>
