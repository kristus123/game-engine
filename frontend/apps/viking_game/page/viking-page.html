<overlay-absolute max-size>
	<img max-size blur float src="Gif.aurora" />
</overlay-absolute>

<overlay-absolute max-size overflow-hidden>
	<button class="page-nav" float-top-left on-click-open-page="aoe-page">← AOE Map</button>

	<div class="viking-layout">
		<div class="viking-panel viking-portrait-panel">
			<div class="viking-primary-content">
				<img max-size src="Png.painting" />
			</div>

			<div id="advisors" class="viking-secondary-content advisor-grid"></div>
		</div>

		<div class="viking-panel viking-story-panel">
			<div id="story" class="viking-primary-content viking-story" scrollable></div>

			<div id="choices" class="viking-secondary-content choice-grid"></div>
		</div>
	</div>
</overlay-absolute>

<template id="advisorTemplate">
	<button class="advisor" on-hover-show="advicePopover">
		<img src="slot-img" />
	</button>
</template>

<template id="choiceButtonTemplate">
	<button class="choice">
		<slot name="text"></slot>
	</button>
</template>

<pop-over id="advicePopover">
	<h1 id="h1"></h1>
	<p id="p"></p>
</pop-over>
