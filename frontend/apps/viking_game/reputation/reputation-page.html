<overlay-absolute max-size>
	<img max-size blur float src="Gif.aurora" />
	<overlay-absolute max-size>
		<button class="page-nav" float-top-left on-click-open-page="village-page">← Village</button>
		<section class="viking-content-page reputation-page-content">
			<h1>Village Reputation</h1>
			<p class="page-intro">The name Vikingheim carries farther than its walls.</p>
			<strong class="reputation-status">Respected</strong>
			<div class="reputation-grid">
				<button on-click="showGenerosity"><span>✦</span><h2>Generosity</h2><p>Neighbors remember the supplies you share in hard winters.</p></button>
				<button on-click="showReliability"><span>⚒</span><h2>Reliability</h2><p>Promises kept during the road-building have earned trust.</p></button>
				<button on-click="showHospitality"><span>ᛉ</span><h2>Hospitality</h2><p>Travelers speak warmly of the fire and food at your hall.</p></button>
			</div>
		</section>
	</overlay-absolute>
</overlay-absolute>
<custom-modal id="modal" hidden></custom-modal>
