<overlay-fixed>
	<flex-v class="pretty-layout-body">
		<flex-h space-between style="gap: 12px; padding: 14px; background: #e6d4a2">
			<div>
				<h1 style="font-size: 64px">Vikingheim</h1>
				<p style="font-size: 23px">Northern settlement</p>
			</div>
			<flex-h style="flex-wrap: nowrap; gap: 60px; color: #342719; font-size: 31px">
				<span>
					Actions taken
					<span id="actionsTaken">x</span>
				</span>
				<span>
					☀ Year
					<span id="year">x</span>
				</span>
				<span>
					Wood ᚠ
					<span id="wood">x</span>
				</span>
				<div class="village-virtues">
					<strong>Village virtues</strong>
					<span title="Neighbors remember the supplies you share in hard winters.">✦ Generosity</span>
					<span title="Promises kept during road-building have earned trust.">⚒ Reliability</span>
					<span title="Travelers speak warmly of the fire and food at your hall.">ᛉ Hospitality</span>
				</div>
			</flex-h>
		</flex-h>

		<flex-h class="pretty-layout-content">
			<slot></slot>
		</flex-h>

		<flex-h id="aoe-footer" space-between align-center style="gap: 8px; padding: 6px; background: #e6d4a2">
			<offset-element width="200px" offset-y="-20px">
				<img src="Png.reindeer" stretch style="height: 200px" />
				<h2 style="height: 28px; display: grid; place-items: center; color: #342719; font-size: 16px">Jarle</h2>
			</offset-element>

			<button on-click-open-page="village-page">Village</button>
			<button on-click-open-page="viking-page">Story</button>
			<button on-click-open-page="inventory-page">ᚠ Inventory</button>
			<button on-click-open-page="family-page">ᛟ Family</button>
			<button id="relationships" on-click-open-page="relationships-page">ᛉ Relationships</button>
			<button on-click-open-page="lore-page">ᚱ Lore</button>
			<offset-element class="map-preview" offset-y="-14px" width="230px" height="400px">
				<button class="map-preview-button" on-click-open-page="map-page">
					<img src="Png.minimap" stretch />
					<span>Open map</span>
				</button>
			</offset-element>
		</flex-h>
	</flex-v>
</overlay-fixed>
