<overlay-absolute max-size>
	<img max-size blur float src="Gif.aurora" />
	<overlay-absolute max-size>
		<button class="page-nav" float-top-left on-click-open-page="village-page">← Village</button>
		<section class="map-page-content">
			<div class="map-frame">
				<img
					src="/apps/viking_game/pictures/vikingheim-map.webp"
					alt="Illustrated map of Vikingheim and the northern lands"
				/>
				<button
					class="map-marker map-marker-village"
					style="--x: 270; --y: 430"
					aria-label="Open Vikingheim village"
					title="Vikingheim village"
					on-click-open-page="village-page"
				>
					<span class="map-marker-label">Friendly Clan</span>
					<span aria-hidden="true">🏰</span>
				</button>
			</div>
		</section>
	</overlay-absolute>
</overlay-absolute>
