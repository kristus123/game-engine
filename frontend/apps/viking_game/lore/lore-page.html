<overlay-absolute max-size>
	<img max-size blur float src="Gif.aurora" />
	<overlay-absolute max-size>
		<button class="page-nav" float-top-left on-click-open-page="village-page">← Village</button>
		<section class="viking-content-page lore-page-content">
			<h1>Lore of Vikingheim</h1>
			<p class="page-intro">Stories of the valley, kept alive above the village fire.</p>
			<div class="lore-scroll">
				<button on-click="showHearth">
					<span>Ⅰ</span>
					<div>
						<h2>The First Hearth</h2>
						<p>
							Old Jarle says the first settlers followed the northern lights until one green ribbon settled above this
							valley. They built their hall where the snow melted first.
						</p>
					</div>
				</button>
				<button on-click="showMountain">
					<span>Ⅱ</span>
					<div>
						<h2>The Watchful Mountain</h2>
						<p>
							The mountain to the east is said to remember every oath spoken beneath it. At dawn, its peak shines like a
							blade.
						</p>
					</div>
				</button>
				<button on-click="showRiver">
					<span>Ⅲ</span>
					<div>
						<h2>The River Below</h2>
						<p>
							Before Vikingheim had roads, the river carried messages between the clans. Its bends still mark the oldest
							paths through the forest.
						</p>
					</div>
				</button>
			</div>
		</section>
	</overlay-absolute>
</overlay-absolute>
<custom-modal id="modal" hidden></custom-modal>
