<overlay-absolute max-size>
	<img max-size blur float src="Gif.aurora" />
	<overlay-absolute max-size>
		<button class="page-nav" float-top-left on-click-open-page="village-page">← Village</button>
		<section class="viking-content-page inventory-page-content">
			<h1>Inventory</h1>
			<p class="page-intro">The stores carried safely into Vikingheim.</p>
			<div class="item-grid">
				<button class="item-card" on-click="showTimber">
					<span class="item-icon">ᚠ</span>
					<h2>Timber</h2>
					<strong>12</strong>
					<p>Useful for fires, shelters, and a growing settlement.</p>
				</button>
				<button class="item-card" on-click="showRations">
					<span class="item-icon">✦</span>
					<h2>Rations</h2>
					<strong>8</strong>
					<p>Dried fish, berries, and enough grain for the next journey.</p>
				</button>
				<button class="item-card" on-click="showTradeGoods">
					<span class="item-icon">◆</span>
					<h2>Trade goods</h2>
					<strong>4</strong>
					<p>Small treasures that may open a door with the right neighbor.</p>
				</button>
				<button class="item-card" on-click="showTools">
					<span class="item-icon">⚒</span>
					<h2>Tools</h2>
					<strong>3</strong>
					<p>A hatchet, a fishing hook, and a well-used skinning knife.</p>
				</button>
			</div>
		</section>
	</overlay-absolute>
</overlay-absolute>
