<overlay-fixed max-size style="background:transparent;">
	<flex-v max-size style="gap:20px; justify-content:space-between;">
		<flex-h style="flex-wrap:nowrap; justify-content:space-between; gap:12px; padding:8px 14px; border:2px solid #675333; border-radius:12px; background:#e6d4a2;">
			<div>
				<h1 style="font-size:38px; color:#342719;">Vendelheim</h1>
				<p style="font-size:16px; line-height:1.2; color:#665334;">Northern settlement</p>
			</div>
			<flex-h style="flex-wrap:nowrap; gap:20px; color:#342719; font-size:22px;">
				<span>☀ Day 1</span>
				<span>ᚠ 120</span>
				<span>ᛟ 85</span>
			</flex-h>
		</flex-h>

		<flex-h style="flex:1; min-height:0; flex-wrap:nowrap; align-items:stretch; gap:10px;">
			<section id="worldCanvas" style="flex:1; min-width:0; border:3px solid #675333; border-radius:12px; background:rgba(230,212,162,.2); box-shadow:inset 0 0 24px #34271944;"></section>
		</flex-h>

		<flex-h style="flex:0 0 auto; position:relative; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:8px; padding:6px 196px 6px 136px; border:2px solid #675333; border-radius:12px; background:#e6d4a2;">
			<div style="position:absolute; left:8px; top:-70px; width:120px; height:150px; overflow:hidden; border:3px solid #675333; border-radius:12px; background:#e6d4a2; box-shadow:0 3px 10px #20180e88;">
				<div style="height:116px; overflow:hidden;">
					<img src="Png.reindeer" alt="Reindeer profile picture" stretch>
				</div>
				<h2 style="height:28px; display:grid; place-items:center; color:#342719; font-size:16px;">Reindeer</h2>
			</div>
			<button type="button" style="flex:1 1 100px; min-width:100px; height:70px; padding:8px 4px; border:2px solid #755a35; border-radius:10px; background:#d4bd82; color:#342719; font-size:16px;">ᚠ Inventory</button>
			<button type="button" style="flex:1 1 100px; min-width:100px; height:70px; padding:8px 4px; border:2px solid #755a35; border-radius:10px; background:#d4bd82; color:#342719; font-size:16px;">ᛟ Family</button>
			<button type="button" style="flex:1 1 100px; min-width:100px; height:70px; padding:8px 4px; border:2px solid #755a35; border-radius:10px; background:#d4bd82; color:#342719; font-size:16px;">↑ Reputation</button>
			<button type="button" style="flex:1 1 100px; min-width:100px; height:70px; padding:8px 4px; border:2px solid #755a35; border-radius:10px; background:#d4bd82; color:#342719; font-size:16px;">ᛉ Bonds</button>
			<button type="button" style="flex:1 1 100px; min-width:100px; height:70px; padding:8px 4px; border:2px solid #755a35; border-radius:10px; background:#d4bd82; color:#342719; font-size:16px;">ᚱ Lore</button>
			<div style="position:absolute; right:8px; top:-50px; width:180px; height:130px; overflow:hidden; border:4px solid #675333; border-radius:12px; background-color:#a6a16b; background-image:linear-gradient(135deg, transparent 38%, #7e8d5c 39% 53%, transparent 54%), repeating-linear-gradient(0deg, transparent 0 17px, #596b4933 18px 19px), repeating-linear-gradient(90deg, transparent 0 17px, #596b4933 18px 19px); box-shadow:0 3px 10px #20180e88;">
				<span style="position:absolute; top:6px; left:8px; padding:2px 8px; border-radius:8px; background:#e6d4a2dd; color:#342719; font-size:14px;">Map</span>
				<span style="position:absolute; left:58%; top:57%; width:12px; height:12px; border:2px solid #f3e5bb; border-radius:50%; background:#a63d2d; box-shadow:0 0 0 3px #a63d2d66;"></span>
			</div>
		</flex-h>
	</flex-v>
</overlay-fixed>
