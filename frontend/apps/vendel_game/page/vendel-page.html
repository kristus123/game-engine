<overlay-fixed max-size>
	<img max-size blur float src="Gif.aurora" />
</overlay-fixed>

<overlay-fixed max-size overflow-hidden>
	<div class="vendel-layout">
		<div class="vendel-panel vendel-portrait-panel">
			<div class="vendel-primary-content">
				<img max-size src="Png.painting" />
			</div>

			<div id="advisors" class="vendel-secondary-content advisor-grid"></div>
		</div>

		<div class="vendel-panel vendel-story-panel">
			<div id="story" class="vendel-primary-content vendel-story" scrollable></div>

			<div id="choices" class="vendel-secondary-content choice-grid"></div>
		</div>
	</div>
</overlay-fixed>

<template id="advisorTemplate">
	<button class="advisor" on-hover-show="advicePopover">
		<img src="slot-img" />
	</button>
</template>

<template id="choiceButtonTemplate">
	<button class="choice">
		<slot name="text"></slot>
	</button>
</template>

<pop-over id="advicePopover">
	<h1 id="h1"></h1>
	<p id="p"></p>
</pop-over>
