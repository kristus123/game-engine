<main class="translate-shell">
	<section id="translationResult" hidden>
		<h2 id="sourceHeading">English</h2>
		<p id="sourceText" class="translate-original"></p>
		<p id="detectedLanguages" class="translate-detected" hidden></p>
		<h2 id="targetHeading">Japanese</h2>
		<p id="translatedText" class="translate-result"></p>
	</section>
	<div class="translate-controls">
		<p id="translationStatus">Ready when you are</p>
		<button id="toggleRecording" type="button">Start recording</button>
	</div>
</main>
